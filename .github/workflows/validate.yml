name: Validate Social Command Center

on:
  push:
    branches:
      - main
      - feat/cloud-worker-integration
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check server and worker syntax
        run: npm run check:server

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
